<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L.A.A.S. Suite - Lubrication As A Service</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    [v-cloak] {
      display: none !important;
    }
  </style>
  <!-- Firebase Cloud SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- SheetJS for Client-Side Excel Exports -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      console.error('App initialization error:', e.error || e.message);
      var appEl = document.getElementById('app');
      if (appEl && appEl.hasAttribute('v-cloak')) {
        appEl.removeAttribute('v-cloak');
        var b = document.createElement('div');
        b.style = 'background:#fef2f2;border:1px solid #f87171;color:#991b1b;padding:16px;margin:16px;border-radius:8px;font-family:sans-serif;font-weight:bold;';
        b.innerHTML = 'Initialisatiefout: ' + (e.message || 'Onbekende fout') + ' (regel: ' + (e.lineno || '') + ')';
        document.body.prepend(b);
      }
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
<div id="app" v-cloak class="min-h-screen flex flex-col">

  <!-- ========================================================================= -->
  <!-- LOGIN SCREEN (AUTH GATE)                                                  -->
  <!-- ========================================================================= -->
  <div v-if="!isAuthenticated" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950 p-4 sm:p-6 w-full fixed inset-0 z-50 overflow-y-auto">
    <!-- Decorative glow elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/40 p-8 sm:p-10 space-y-6 text-slate-800">
      <!-- Header / Logo -->
      <div class="text-center space-y-3">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white font-extrabold text-2xl shadow-lg shadow-sky-500/25 ring-4 ring-sky-100">
          L
        </div>
        <div>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">L.A.A.S. Suite</h2>
          <p class="text-xs font-semibold text-sky-600 uppercase tracking-widest mt-0.5">Lubrication As A Service</p>
          <p class="text-xs text-slate-500 mt-1">Interflon BeLux &bull; Enterprise Platform</p>
        </div>
      </div>

      <!-- Security Notice Badge -->
      <div class="flex items-center gap-2.5 p-3 rounded-xl bg-slate-100 border border-slate-200/80 text-xs text-slate-600">
        <svg class="w-4 h-4 text-sky-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <span>Beveiligde toegang. Voer het wachtwoord in om de suite te openen.</span>
      </div>

      <!-- Login Form -->
      <form @submit.prevent="loginApp" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Wachtwoord:</label>
          <div class="relative">
            <input 
              :type="showLoginPassword ? 'text' : 'password'" 
              v-model="loginPassword" 
              placeholder="Voer wachtwoord in..." 
              autofocus
              class="w-full px-4 py-3 pr-11 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm font-medium focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition shadow-inner"
            >
            <button 
              type="button" 
              @click="showLoginPassword = !showLoginPassword" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 cursor-pointer transition"
              tabindex="-1"
              :title="showLoginPassword ? 'Verberg wachtwoord' : 'Toon wachtwoord'"
            >
              <svg v-if="!showLoginPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg v-else class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
            </button>
          </div>
          <p v-if="loginError" class="text-xs text-rose-600 font-bold mt-1.5 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span v-if="loginErrorMessage">{{ loginErrorMessage }}</span><span v-else>Onjuist wachtwoord</span>
          </p>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 cursor-pointer select-none text-slate-600">
            <input type="checkbox" v-model="rememberMe" class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
            <span>Onthoud mijn sessie op dit apparaat</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          :disabled="loginLoading"
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold text-sm shadow-md shadow-sky-500/25 transition flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
        >
          <svg v-if="loginLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span v-if="!loginLoading">Inloggen</span>
          <span v-else>Verifiëren...</span>
          <svg v-if="!loginLoading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="pt-2 text-center text-[11px] text-slate-400 border-t border-slate-100">
        &copy; 2026 Interflon &bull; L.A.A.S. Suite 2.0
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- AUTHENTICATED APP SHELL                                                   -->
  <!-- ========================================================================= -->
  <template v-else>


  <!-- ========================================================================= -->
  <!-- TOP APP HEADER -->
  <!-- ========================================================================= -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div @click="backToPortal" class="flex items-center gap-3 cursor-pointer hover:opacity-90 transition group" title="Terug naar portaal overzicht">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-extrabold shadow-sm group-hover:scale-105 transition-transform">
          L
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-slate-900 tracking-tight group-hover:text-sky-600 transition-colors">L.A.A.S. Suite</h1>
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-sky-100 text-sky-800 tracking-wide uppercase">2.0 Multi-Client</span>
          </div>
          <p class="text-xs text-slate-400">Interflon &bull; Lubrication As A Service Enterprise</p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-3">
        <!-- Toast feedback -->
        <transition enter-active-class="transition duration-200 ease-out" enter-from-class="transform opacity-0 -translate-y-2" enter-to-class="transform opacity-100 translate-y-0" leave-active-class="transition duration-150 ease-in" leave-from-class="transform opacity-100" leave-to-class="transform opacity-0">
          <div v-if="toastMessage" class="px-3 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-medium flex items-center gap-1.5 shadow-xs">
            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            {{ toastMessage }}
          </div>
        </transition>

        <!-- Lock / Unlock Security Status -->
        <button v-if="!isUnlocked" @click="showPasswordModal = true" title="Klik om beheerdersmodus te ontgrendelen" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-semibold transition cursor-pointer">
          <svg class="w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <span>🔒 Ontgrendelen</span>
        </button>
        <button v-else @click="lockSystem" title="Klik om beheerdersmodus weer te vergrendelen" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold border border-emerald-200 transition cursor-pointer">
          <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
          <span>🔓 Beheerdersmodus</span>
        </button>

        <!-- Logout Button -->
        <button @click="logoutApp" title="Uitloggen uit L.A.A.S. Suite" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 text-xs font-semibold transition cursor-pointer">
          <svg class="w-3.5 h-3.5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Uitloggen</span>
        </button>

        <!-- Direct back button if in contract view -->
        <button v-if="currentView !== 'clients_portal'" @click="backToPortal" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Portaal Overzicht
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- MAIN CONTAINER -->
  <!-- ========================================================================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- ======================================================================= -->
    <!-- VIEW 1: CLIENTS & CONTRACTS PORTAL                                      -->
    <!-- ======================================================================= -->
    <div v-if="currentView === 'clients_portal'" class="space-y-6">

      <!-- Portal Tabs (Actief vs Archief) & Search -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Tab buttons -->
        <div class="flex items-center gap-2">
          <button @click="activePortalTab = 'active'" :class="activePortalTab === 'active' ? 'bg-slate-900 text-white font-semibold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium'" class="px-4 py-2 rounded-xl text-xs transition flex items-center gap-2">
            <span>Actieve Klanten &amp; Contracten</span>
            <span class="px-2 py-0.5 rounded-full text-[10px]" :class="activePortalTab === 'active' ? 'bg-slate-700 text-white' : 'bg-slate-200 text-slate-700'">
              {{ Object.keys(hierarchy).length }}
            </span>
          </button>

          <button @click="activePortalTab = 'archive'" :class="activePortalTab === 'archive' ? 'bg-amber-600 text-white font-semibold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium'" class="px-4 py-2 rounded-xl text-xs transition flex items-center gap-2">
            <span>Archief &amp; Prullenmand</span>
            <span class="px-2 py-0.5 rounded-full text-[10px]" :class="activePortalTab === 'archive' ? 'bg-amber-700 text-white' : 'bg-slate-200 text-slate-700'">
              {{ archiveData.customers.length + archiveData.departments.length + archiveData.contracts.length }}
            </span>
          </button>
        </div>

        <!-- Universal Search Bar and Expand/Collapse All Buttons -->
        <div v-if="activePortalTab === 'active'" class="flex flex-wrap items-center gap-2">
          
          <div class="relative w-full sm:w-72">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input 
              v-model="portalSearchQuery"
              type="text" 
              placeholder="Zoek klant, afdeling of contract..." 
              class="w-full pl-9 pr-8 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-sky-500 focus:border-transparent transition"
            >
            <button v-if="portalSearchQuery" @click="portalSearchQuery = ''" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <!-- Expand All / Collapse All Buttons -->
          <button @click="expandAllCustomers" title="Vouw alle klantsecties uit" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            <span>Alles uitvouwen</span>
          </button>

          <button @click="collapseAllCustomers" title="Vouw alle klantsecties in" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
            <span>Alles invouwen</span>
          </button>

          <!-- Globale Suite Knoppen (Prijslijst & Instellingen) -->
          <button 
            type="button"
            @click="openSuiteSettingsModal('pricelist')" 
            title="Globale Prijslijst Catalogus raadplegen, doorzoeken en filteren" 
            class="px-3.5 py-2 rounded-xl bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-800 font-semibold text-xs transition flex items-center gap-1.5 shadow-xs cursor-pointer"
          >
            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span>📋 Globale Prijslijst</span>
          </button>

          <button 
            @click="openSuiteSettingsModal('pricelist')" 
            title="Globale Suite Instellingen (Prijslijst, Standaardpakketten, Indexering & Toeslagen)" 
            class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs transition flex items-center gap-1.5 shadow-xs cursor-pointer"
          >
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>Suite Instellingen</span>
          </button>

          <!-- Add Buttons in Hierarchical Order -->
          <button @click="openCreateCustomer" class="px-3.5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs transition flex items-center gap-1.5 shadow-xs cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>+ Klant</span>
          </button>
          <button @click="openCreateDept()" class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold text-xs transition flex items-center gap-1.5 shadow-xs cursor-pointer">
            <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            <span>+ Afdeling</span>
          </button>
          <button @click="openCreateContract()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition flex items-center gap-1.5 shadow-xs cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span>+ Contract</span>
          </button>
        </div>
      </div>

      <!-- ===================================================================== -->
      <!-- TAB CONTENT: ACTIVE HIERARCHY                                         -->
      <!-- ===================================================================== -->
      <div v-if="activePortalTab === 'active'" class="space-y-6">

        <!-- Empty state -->
        <div v-if="Object.keys(hierarchy).length === 0" class="bg-white rounded-2xl border-2 border-dashed border-slate-300 p-12 text-center">
          <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          </div>
